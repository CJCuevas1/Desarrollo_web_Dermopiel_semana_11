{% extends "base.html" %}
{% block title %}Proveedores - Dermopiel{% endblock %}
{% block content %}
<h2>Gestión de Proveedores</h2>
<table class="table table-striped table-hover mt-3">
    <thead class="table-dark">
        <tr><th>ID</th><th>Empresa</th><th>Contacto</th><th>Teléfono</th></tr>
    </thead>
    <tbody>
        {% for pr in proveedores %}
        <tr>
            <td>{{ pr.id }}</td>
            <td>{{ pr.empresa }}</td>
            <td>{{ pr.contacto }}</td>
            <td>{{ pr.telefono }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
