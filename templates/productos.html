<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lista de Productos</title>
    <!-- Incluimos Bootstrap para que se vea centrado y bonito -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5" style="max-width: 600px;">
        
        <h1 class="mb-4">Lista de Servicios / Productos</h1>
        
        <ul class="list-group mb-4">
        {% for producto in productos %}
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <span><strong>{{ producto.nombre }}</strong> - ${{ producto.precio }}</span>
                <span class="badge bg-primary rounded-pill">Stock: {{ producto.stock }}</span>
            </li>
        {% else %}
            <li class="list-group-item text-center text-muted">No hay productos registrados todavía.</li>
        {% endfor %}
        </ul>
        
        <a href="{{ url_for('crear_producto') }}" class="btn btn-primary">Registrar otro producto</a>
        
    </div>
</body>
</html>
