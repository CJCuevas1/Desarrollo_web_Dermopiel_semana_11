<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lista de Productos</title>
</head>
<body>
    <h1>Lista de Servicios / Productos</h1>
    <ul>
    {% for servicio in servicios %}
        <li>{{ servicio.nombre }} - ${{ servicio.precio }} ({{ servicio.categoria }})</li>
    {% endfor %}
    </ul>
    <a href="/productos/nuevo">Registrar otro producto</a>
</body>
</html>
