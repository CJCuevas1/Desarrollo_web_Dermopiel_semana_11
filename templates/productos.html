{% extends "base.html" %}
{% block title %}Productos - Dermopiel{% endblock %}
{% block content %}
<h2><i class="bi bi-box"></i> Gestión de Productos</h2>
<table class="table table-striped table-hover mt-3">
    <thead class="table-dark">
        <tr><th>ID</th><th>Nombre</th><th>Precio</th><th>Stock</th></tr>
    </thead>
    <tbody>
        {% for p in productos %}
        <tr>
            <td>{{ p.id }}</td>
            <td>{{ p.nombre }}</td>
            <td>${{ "%.2f"|format(p.precio) }}</td>
            <td><span class="badge bg-success">{{ p.stock }} unidades</span></td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
