{% extends "base.html" %}
{% block title %}Facturación - Dermopiel{% endblock %}
{% block content %}
<h2>Módulo de Facturación</h2>
<table class="table table-striped table-hover mt-3">
    <thead class="table-dark">
        <tr><th>N° Factura</th><th>Cliente</th><th>Fecha</th><th>Total</th></tr>
    </thead>
    <tbody>
        {% for f in facturas %}
        <tr>
            <td>{{ f.num }}</td>
            <td>{{ f.cliente }}</td>
            <td>{{ f.fecha }}</td>
            <td>${{ "%.2f"|format(f.total) }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
