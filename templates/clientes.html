{% extends "base.html" %}
{% block title %}Clientes - Dermopiel{% endblock %}
{% block content %}
<h2>Gestión de Clientes</h2>
<table class="table table-striped table-hover mt-3">
    <thead class="table-dark">
        <tr><th>ID</th><th>Nombre</th><th>Teléfono</th><th>Email</th></tr>
    </thead>
    <tbody>
        {% for c in clientes %}
        <tr>
            <td>{{ c.id }}</td>
            <td>{{ c.nombre }}</td>
            <td>{{ c.telefono }}</td>
            <td>{{ c.email }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
